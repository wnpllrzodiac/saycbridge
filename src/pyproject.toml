[project]
name = "saycbridge"
version = "0.1.0"
description = "Bridge bidder"
authors = [{name = "Eric Seidel", email = "github@eseidel.com"}]
license = {text = "BSD"}
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.8.17",
    "networkx>=2.8.3",
    "flask>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "gib", "z3b"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
